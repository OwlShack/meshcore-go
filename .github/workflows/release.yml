name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag with no CHANGELOG.md section gets only the generated notes.
      - name: Extract release notes
        run: |
          scripts/release-notes.sh "${VERSION}" > RELEASE_NOTES.md
          echo "::notice::release body is $(wc -l < RELEASE_NOTES.md) lines from CHANGELOG.md"

      - name: Create submodule tags
        run: |
          git tag "companion/transport/${VERSION}"
          git tag "hardware/transport/${VERSION}"
          git tag "hardware/sx12xx/${VERSION}"
          git tag "hardware/openhop/${VERSION}"

      - name: Push submodule tags
        run: |
          git push origin "companion/transport/${VERSION}"
          git push origin "hardware/transport/${VERSION}"
          git push origin "hardware/sx12xx/${VERSION}"
          git push origin "hardware/openhop/${VERSION}"

      - name: Create GitHub Release
        run: |
          gh release create "${VERSION}" --notes-file RELEASE_NOTES.md --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
